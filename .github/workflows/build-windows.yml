name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [agent/agate-remote-v2]
    paths:
      - "agent/**"
      - "web/**"
      - "server.py"
      - "profiles.json"
      - "requirements.txt"
      - "AgateRemote.spec"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "web/**"
      - "server.py"
      - "profiles.json"
      - "requirements.txt"
      - "AgateRemote.spec"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Atualizar ferramentas Python
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Instalar dependências
        run: python -m pip install --only-binary=av -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall server.py agent
      - name: Gerar executável
        run: python -m PyInstaller --noconfirm --clean AgateRemote.spec
      - name: Testar servidor dentro do executável
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\AgateRemote.exe" -ArgumentList "--server-only" -PassThru
          $ready = $false
          try {
            for ($attempt = 1; $attempt -le 45; $attempt++) {
              if ($process.HasExited) {
                break
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/info" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "Agate Remote") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              $log = Join-Path $env:LOCALAPPDATA "AgateRemote\agate-remote.log"
              if (Test-Path $log) {
                Write-Host "===== LOG DO AGATE REMOTE ====="
                Get-Content $log -Tail 200
              }
              throw "O executável não respondeu em http://127.0.0.1:8765/api/info"
            }
            Write-Host "Teste de inicialização aprovado."
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Enviar executável
        uses: actions/upload-artifact@v4
        with:
          name: AgateRemote-Windows
          path: dist/AgateRemote.exe
          if-no-files-found: error
