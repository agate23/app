name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [agent/agate-remote-v2]
    paths:
      - "agent/**"
      - "web/**"
      - "server.py"
      - "profiles.json"
      - "requirements.txt"
      - "AgateRemote.spec"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "web/**"
      - "server.py"
      - "profiles.json"
      - "requirements.txt"
      - "AgateRemote.spec"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall server.py agent
      - name: Gerar executável
        run: pyinstaller --noconfirm --clean AgateRemote.spec
      - name: Enviar executável
        uses: actions/upload-artifact@v4
        with:
          name: AgateRemote-Windows
          path: dist/AgateRemote.exe
          if-no-files-found: error
